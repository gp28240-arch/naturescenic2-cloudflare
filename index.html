<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم همراه</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .lang-select { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
        select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 14px; }
        textarea { width: 100%; height: 120px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; resize: none; font-size: 15px; margin-bottom: 10px; }
        .btn-action { width: 100%; padding: 12px; background-color: #007bff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .btn-action:hover { background-color: #0056b3; }
        .output-box { margin-top: 20px; padding: 15px; background: #eef2f7; border-radius: 8px; min-height: 100px; position: relative; direction: ltr; text-align: left; }
        .speak-btn { position: absolute; bottom: 10px; right: 10px; background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 50px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 14px; }
        .speak-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>مترجم هوشمند</h2>

    <div class="lang-select">
        <select id="sourceLang">
            <option value="fa" selected>فارسی (Persian)</option>
            <option value="auto">تشخیص خودکار (Auto)</option>
            <option value="en">انگلیسی (English)</option>
            <option value="ar">عربی (Arabic)</option>
            <option value="tr">ترکی (Turkish)</option>
            <option value="fr">فرانسوی (French)</option>
            <option value="de">آلمانی (German)</option>
            <option value="es">اسپانیایی (Spanish)</option>
            <option value="it">ایتالیایی (Italian)</option>
            <option value="ru">روسی (Russian)</option>
            <option value="zh-CN">چینی (Chinese)</option>
            <option value="ja">ژاپنی (Japanese)</option>
            <option value="ko">کره‌ای (Korean)</option>
            <option value="hi">هندی (Hindi)</option>
        </select>

        <span>➔</span>

        <select id="targetLang">
            <option value="en" selected>انگلیسی (English)</option>
            <option value="fa">فارسی (Persian)</option>
            <option value="ar">عربی (Arabic)</option>
            <option value="tr">ترکی (Turkish)</option>
            <option value="fr">فرانسوی (French)</option>
            <option value="de">آلمانی (German)</option>
            <option value="es">اسپانیایی (Spanish)</option>
            <option value="it">ایتالیایی (Italian)</option>
            <option value="ru">روسی (Russian)</option>
            <option value="zh-CN">چینی (Chinese)</option>
            <option value="ja">ژاپنی (Japanese)</option>
            <option value="ko">کره‌ای (Korean)</option>
            <option value="hi">هندی (Hindi)</option>
        </select>
    </div>

    <textarea id="inputText" placeholder="متن را اینجا بنویسید..."></textarea>
    <button class="btn-action" onclick="translateText()">ترجمه کن</button>

    <div class="output-box">
        <p id="translatedText">ترجمه در اینجا نمایش داده می‌شود...</p>
        <button class="speak-btn" onclick="speakTranslation()">🔊 تلفظ</button>
    </div>
</div>

<script>
    async function translateText() {
        const text = document.getElementById('inputText').value.trim();
        const sourceLang = document.getElementById('sourceLang').value;
        const targetLang = document.getElementById('targetLang').value;
        const outputElement = document.getElementById('translatedText');

        if (!text) {
            outputElement.innerText = "لطفاً متنی وارد کنید.";
            return;
        }

        outputElement.innerText = "در حال ترجمه...";

        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            const data = await response.json();

            let resultText = "";
            if (data && data[0]) {
                data[0].forEach(item => {
                    if (item[0]) resultText += item[0];
                });
            }
            outputElement.innerText = resultText || "خطا در دریافت ترجمه.";
        } catch (error) {
            outputElement.innerText = "ارتباط با سرور برقرار نشد.";
        }
    }

    function speakTranslation() {
        const text = document.getElementById('translatedText').innerText;
        const targetLang = document.getElementById('targetLang').value;

        if (!text || text === "ترجمه در اینجا نمایش داده می‌شود..." || text === "در حال ترجمه...") return;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLang === 'auto' ? 'en-US' : targetLang;
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("قابلیت تلفظ صوتی پشتیبانی نمی‌شود.");
        }
    }
</script>

</body>
</html>
