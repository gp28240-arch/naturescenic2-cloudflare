  <script>
    const SUPABASE_URL = "https://xvkbwsejloapnkjgrjde.supabase.co";

    const BUCKET_NAME = "dilgon-image";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let mediaItems = [
      { id: 'c1', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/Photos-of-Belqis-Spring/1.JPG', titleFa: 'چشمه بلقیس چرام (عکس ۱)', titleEn: 'Belqis Spring Choram (1)' },
      { id: 'c2', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/Photos-of-Belqis-Spring/2.JPG', titleFa: 'چشمه بلقیس چرام (عکس ۲)', titleEn: 'Belqis Spring Choram (2)' },
      { id: 'c3', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/Photos-of-Belqis-Spring/3.JPG', titleFa: 'چشمه بلقیس چرام (عکس ۳)', titleEn: 'Belqis Spring Choram (3)' },
      { id: 'c4', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/Photos-of-Belqis-Spring/4.JPG', titleFa: 'چشمه بلقیس چرام (عکس ۴)', titleEn: 'Belqis Spring Choram (4)' },

      { id: 'd2', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/dilgon-image/2.JPG', titleFa: 'طبیعت دیلگون (عکس ۲)', titleEn: 'Dilgun Nature (2)' },
      { id: 'd3', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/dilgon-image/3.JPG', titleFa: 'طبیعت دیلگون (عکس ۳)', titleEn: 'Dilgun Nature (3)' },
      { id: 'd4', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/dilgon-image/4.JPG', titleFa: 'طبیعت دیلگون (عکس ۴)', titleEn: 'Dilgun Nature (4)' },
      { id: 'd5', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/dilgon-image/5.JPG', titleFa: 'طبیعت دیلگون (عکس ۵)', titleEn: 'Dilgun Nature (5)' },
      { id: 'd7', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/dilgon-image/7.JPG', titleFa: 'طبیعت دیلگون (عکس ۷)', titleEn: 'Dilgun Nature (7)' },
      { id: 'd8', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/dilgon-image/8.JPG', titleFa: 'طبیعت دیلگون (عکس ۸)', titleEn: 'Dilgun Nature (8)' },
      { id: 'd9', type: 'image', src: 'https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/dilgon-image/9.JPG', titleFa: 'طبیعت دیلگون (عکس ۹)', titleEn: 'Dilgun Nature (9)' }
    ];

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // --- ساخت تصویر AI ---
    async function submitAIGeneration() {
      const prompt = document.getElementById('ai-prompt-input').value.trim();
      const resultBox = document.getElementById('ai-image-result');

      if (!prompt) { alert('لطفاً توصیفی بنویسید'); return; }

      resultBox.innerHTML = `<p style="color:#a855f7; font-weight:bold;">✨ در حال ساخت تصویر... لطفاً شکیبا باشید ✨</p>`;

      try {
        const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(prompt)}`);
        const transData = await transRes.json();
        const enPrompt = transData[0][0][0] || prompt;

        const seed = Math.floor(Math.random() * 100000);
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enPrompt)}?width=1024&height=576&seed=${seed}&model=flux&nologo=true`;

        const img = new Image();
        img.src = imgUrl;
        img.onload = () => {
          resultBox.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
              <img src="${imgUrl}" class="generated-img">
              <a href="${imgUrl}" target="_blank" download="ai-nature.jpg" class="btn" style="margin-top:10px;">📥 دانلود تصویر اصلی</a>
            </div>`;
        };
        img.onerror = () => { resultBox.innerHTML = `<p style="color:#ef4444;">❌ خطا در دریافت تصویر. بررسی کنید فیلترشکن روشن باشد.</p>`; };
      } catch (e) {
        resultBox.innerHTML = `<p style="color:#ef4444;">❌ خطا در برقراری ارتباط.</p>`;
      }
    }

    // --- بخش مترجم ---
    async function sendTranslationRequest() {
      const src = document.getElementById('trans-source-lang').value;
      const tgt = document.getElementById('trans-target-lang').value;
      const text = document.getElementById('trans-text-input').value.trim();
      const resBox = document.getElementById('translation-result');

      if (!text) return;
      resBox.innerText = "در حال ترجمه...";

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${src}&tl=${tgt}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        let out = "";
        data[0].forEach(i => { if (i[0]) out += i[0]; });
        resBox.innerText = out || "ترجمه یافت نشد";
      } catch (e) {
        resBox.innerText = "خطا در انجام ترجمه. اتصال اینترنت را بررسی کنید.";
      }
    }

    // --- افزودن از لینک ---
    function addURLMedia() {
      const url = document.getElementById('url-input').value.trim();
      const type = document.getElementById('url-type-select').value;
      const title = document.getElementById('url-title-input').value.trim() || 'رسانه جدید';

      if (!url) { alert('لطفاً لینک را وارد کنید'); return; }

      mediaItems.unshift({ id: 'u_' + Date.now(), type: type, src: url, titleFa: title, titleEn: title });
      renderGrid('all');
      closeModal('url-modal');
      document.getElementById('url-input').value = '';
      document.getElementById('url-title-input').value = '';
    }

    // --- رندر کارت‌ها ---
    function renderGrid(filter = 'all') {
      const grid = document.getElementById('media-grid');
      grid.innerHTML = '';
      
      const filtered = mediaItems.filter(i => filter === 'all' || i.type === filter);
      
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'media-card';
        let mediaTag = item.type === 'image' ? `<img src="${item.src}">` : item.type === 'video' ? `<video src="${item.src}" controls></video>` : `<audio src="${item.src}" controls></audio>`;
        card.innerHTML = `
          ${mediaTag}
          <div class="card-body">
            <div class="card-title-fa">${item.titleFa}</div>
            <div class="card-title-en">${item.titleEn || ''}</div>
            <a href="${item.src}" download target="_blank" class="btn-download">📥 دانلود</a>
          </div>`;
        grid.appendChild(card);
      });
    }

    function filterMedia(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid(type);
    }

    function toggleLanguage() {
      alert("Language toggled");
    }

    renderGrid();
  </script>
