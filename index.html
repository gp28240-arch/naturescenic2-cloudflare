<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naturescenic2-ai | دستیار اختصاصی طبیعت</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; direction: rtl; }

    .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .main-header h1 { font-size: 1.5rem; color: #38bdf8; }

    .container { max-width: 800px; margin: 0 auto; background-color: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }

    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 0.9rem; }
    
    textarea, input[type="text"], select {
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.95rem;
    }

    textarea { height: 100px; resize: vertical; }

    .btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #0369a1; }

    .output-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      min-height: 80px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="main-header">
      <h1>naturescenic2-ai</h1>
    </header>

    <div class="input-group">
      <label for="inputText">متن مورد نظر برای ترجمه یا پردازش:</label>
      <textarea id="inputText" placeholder="متن خود را اینجا وارد کنید..."></textarea>
    </div>

    <div class="input-group">
      <label for="targetLang">زبان مقصد:</label>
      <select id="targetLang">
        <option value="fa">فارسی</option>
        <option value="en">انگلیسی</option>
      </select>
    </div>

    <button class="btn" onclick="translateText()">ترجمه متن</button>

    <div class="input-group" style="margin-top: 20px;">
      <label>نتیجه:</label>
      <div id="outputText" class="output-box">نتیجه ترجمه اینجا نمایش داده می‌شود...</div>
    </div>
  </div>

  <script>
    async function translateText() {
      const text = document.getElementById('inputText').value;
      const targetLang = document.getElementById('targetLang').value;
      const outputDiv = document.getElementById('outputText');

      if (!text.trim()) {
        outputDiv.innerText = 'لطفاً متنی را وارد کنید.';
        return;
      }

      outputDiv.innerText = 'در حال ترجمه...';

      try {
        // استفاده از API رایگان ترجمه
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=auto|${targetLang}`);
        const data = await res.json();
        
        if (data && data.responseData) {
          outputDiv.innerText = data.responseData.translatedText;
        } else {
          outputDiv.innerText = 'خطا در دریافت ترجمه.';
        }
      } catch (error) {
        outputDiv.innerText = 'خطا در ارتباط با سرور ترجمه.';
        console.error(error);
      }
    }
  </script>

</body>
</html>
