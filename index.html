<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت رسانه و ابزار ترجمه / هوش مصنوعی</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-action {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }

    .result-box {
      margin-top: 15px;
      padding: 12px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px dashed var(--border);
      min-height: 50px;
      word-break: break-word;
    }

    .generated-img {
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }

    .media-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .media-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .media-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .media-card .info {
      padding: 10px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>پنل هوشمند ساخت تصویر و ترجمه</h1>
  </div>

  <div class="tools-grid">
    
    <!-- بخش ترجمه متن عمومی -->
    <div class="card">
      <h2>🌐 مترجم هوشمند</h2>
      <div class="form-group">
        <label>متن مبدا:</label>
        <textarea id="trans-text-input" placeholder="متن خود را اینجا بنویسید..."></textarea>
      </div>
      <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label>از:</label>
          <select id="trans-source-lang">
            <option value="fa">فارسی</option>
            <option value="en">انگلیسی</option>
            <option value="auto">تشخیص خودکار</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>به:</label>
          <select id="trans-target-lang">
            <option value="en">انگلیسی</option>
            <option value="fa">فارسی</option>
          </select>
        </div>
      </div>
      <button class="btn-action" onclick="sendTranslationRequest()">ترجمه متن</button>
      <div class="result-box" id="translation-result">نتیجه ترجمه اینجا نمایش داده می‌شود...</div>
    </div>

    <!-- بخش ساخت تصویر با هوش مصنوعی GEMINI -->
    <div class="card">
      <h2>✨ ساخت تصویر با هوش مصنوعی GEMINI ✨</h2>
      
      <div class="form-group">
        <label>توصیف تصویر به فارسی (خودکار ترجمه می‌شود):</label>
        <textarea id="fa-prompt-input" placeholder="مثلاً: یک کلبه چوبی در جنگل برفی هنگام غروب آفتاب..."></textarea>
        <button class="btn-action" style="margin-top: 8px; background: #3b82f6;" onclick="translateFaToEnPrompt()">ترجمه توصیف به انگلیسی</button>
      </div>

      <div class="form-group">
        <label>پرامپت نهایی ارسال شده به هوش مصنوعی (انگلیسی):</label>
        <textarea id="ai-prompt-input" placeholder="English description for AI image generation..."></textarea>
      </div>

      <button class="btn-action" style="background: #10b981;" onclick="submitAIGeneration()">تولید و ساخت تصویر</button>

      <div class="result-box" id="ai-image-result" style="text-align: center;">
        تصویر ساخته‌شده اینجا قرار می‌گیرد...
      </div>
    </div>

  </div>

  <!-- بخش گالری رسانه‌ها -->
  <div class="card">
    <h2>🖼️ گالری تصاویر ذخیره‌شده</h2>
    <div class="media-gallery" id="media-gallery">
      <!-- تصاویر ساخته شده اینجا اضافه می‌شوند -->
    </div>
  </div>

</div>

<script>
  // متغیرهای عمومی
  const SYSTEM_PROMPT_PREFIX = "Photorealistic, highly detailed, 8k resolution, ";
  let mediaItems = [];

  // ۱. تابع ترجمه متن عمومی (با استفاده از API اختصاصی و بدون خطا)
  async function sendTranslationRequest() {
    const text = document.getElementById('trans-text-input').value.trim();
    const source = document.getElementById('trans-source-lang').value;
    const target = document.getElementById('trans-target-lang').value;
    const resBox = document.getElementById('translation-result');

    if (!text) {
      alert("لطفاً متنی برای ترجمه وارد کنید.");
      return;
    }

    resBox.innerText = "در حال ترجمه... لطفاً منتظر بمانید.";

    try {
      const langPair = (source === 'auto' ? 'autodetect' : source) + '|' + target;
      const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(langPair)}`;
      
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error("خطا در شبکه");
      
      const data = await response.json();

      if (data && data.responseData && data.responseData.translatedText) {
        resBox.innerText = data.responseData.translatedText;
      } else {
        resBox.innerText = "ترجمه‌ای یافت نشد.";
      }
    } catch (e) {
      console.error(e);
      resBox.innerText = "خطا در دریافت ترجمه. لطفاً اتصال اینترنت خود را بررسی کنید.";
    }
  }

  // ۲. تابع ترجمه پرامپت فارسی به انگلیسی (جلوگیری از ترکیب فارسی و انگلیسی)
  async function translateFaToEnPrompt() {
    const faInput = document.getElementById('fa-prompt-input');
    const enInput = document.getElementById('ai-prompt-input');
    const faText = faInput.value.trim();

    if (!faText) {
      alert("لطفاً ابتدا متن توصیف فارسی را وارد کنید.");
      return;
    }

    // پاک‌سازی کامل کادر انگلیسی و نمایش وضعیت در حال ترجمه
    enInput.value = "در حال ترجمه متن به انگلیسی...";

    try {
      const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(faText)}&langpair=fa|en`;
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data && data.responseData && data.responseData.translatedText) {
        // جایگزینی کاملاً تمیز: فقط پیشوند سیستم + متن ترجمه شده انگلیسی
        const cleanEnglishText = data.responseData.translatedText.trim();
        enInput.value = SYSTEM_PROMPT_PREFIX + cleanEnglishText;
      } else {
        enInput.value = SYSTEM_PROMPT_PREFIX + faText;
      }
    } catch (e) {
      console.warn("خطا در سرویس ترجمه آنلاین:", e);
      enInput.value = SYSTEM_PROMPT_PREFIX + faText;
    }
  }

  // ۳. تابع ساخت تصویر با هوش مصنوعی و ارسال مستقیم پرامپت انگلیسی
  async function submitAIGeneration() {
    const fullPrompt = document.getElementById('ai-prompt-input').value.trim();
    const resBox = document.getElementById('ai-image-result');

    if (!fullPrompt) {
      alert("لطفاً توصیف تصویر را به انگلیسی بنویسید یا ابتدا متن فارسی را ترجمه کنید.");
      return;
    }

    resBox.innerHTML = '<p style="color:#8b5cf6; font-weight:bold;">در حال ساخت تصویر با هوش مصنوعی... لطفاً شکیبا باشید.</p>';

    // ساخت یک ساختار بدون کش به همراه پارامترهای کیفیت بالا
    const seed = Math.floor(Math.random() * 1000000);
    const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?seed=${seed}&width=1280&height=720&nologo=true`;

    const img = new Image();
    img.className = 'generated-img';
    img.alt = fullPrompt;

    img.onload = () => {
      resBox.innerHTML = '';
      resBox.appendChild(img);

      // دکمه افزودن به گالری
      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn-action';
      saveBtn.style.marginTop = '15px';
      saveBtn.style.background = '#10b981';
      saveBtn.innerText = '➕ افزودن به گالری سایت';
      saveBtn.onclick = () => {
        mediaItems.unshift({
          id: 'ai_' + Date.now(),
          src: imageUrl,
          title: fullPrompt.replace(SYSTEM_PROMPT_PREFIX, '')
        });
        renderMediaItems();
        alert("تصویر با موفقیت به گالری اضافه شد.");
      };
      resBox.appendChild(saveBtn);
    };

    img.onerror = () => {
      resBox.innerHTML = '<p style="color:#ef4444; font-weight:bold;">خطا در دریافت تصویر از سرور هوش مصنوعی. لطفاً مجدداً تلاش کنید.</p>';
    };

    img.src = imageUrl;
  }

  // ۴. نمایش تصاویر در گالری
  function renderMediaItems() {
    const gallery = document.getElementById('media-gallery');
    gallery.innerHTML = '';

    if (mediaItems.length === 0) {
      gallery.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">هنوز تصویری اضافه نشده است.</p>';
      return;
    }

    mediaItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'media-card';
      card.innerHTML = `
        <img src="${item.src}" alt="${item.title}">
        <div class="info">
          <p><strong>توصیف:</strong> ${item.title.substring(0, 40)}...</p>
        </div>
      `;
      gallery.appendChild(card);
    });
  }

  // بارگذاری اولیه گالری
  renderMediaItems();
</script>

</body>
</html>
