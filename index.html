<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت رسانه، ترجمه و ساخت تصویر</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      padding: 15px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-action {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 5px;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }

    .result-box {
      margin-top: 15px;
      padding: 12px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px dashed var(--border);
      min-height: 50px;
      word-break: break-word;
    }

    .media-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .media-card {
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      padding: 8px;
    }

    .media-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>پنل هوشمند ساخت تصویر و ترجمه</h1>
  </div>

  <!-- بخش اول: ترجمه عمومی -->
  <div class="card">
    <h2>🌐 بخش ترجمه متن</h2>
    <div class="form-group">
      <label>متن مبدا:</label>
      <textarea id="trans-text-input" placeholder="متن خود را برای ترجمه بنویسید..."></textarea>
    </div>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <div style="flex: 1;">
        <label>از زبان:</label>
        <select id="trans-source-lang">
          <option value="fa">فارسی</option>
          <option value="en">انگلیسی</option>
          <option value="auto">تشخیص خودکار</option>
        </select>
      </div>
      <div style="flex: 1;">
        <label>به زبان:</label>
        <select id="trans-target-lang">
          <option value="en">انگلیسی</option>
          <option value="fa">فارسی</option>
        </select>
      </div>
    </div>
    <button class="btn-action" onclick="sendTranslationRequest()">ترجمه متن</button>
    <div class="result-box" id="translation-result">نتیجه ترجمه در این کادر قرار می‌گیرد...</div>
  </div>

  <!-- بخش دوم: ساخت تصویر GEMINI -->
  <div class="card">
    <h2>✨ ساخت تصویر با هوش مصنوعی GEMINI ✨</h2>
    
    <div class="form-group">
      <label>۱. توصیف تصویر به فارسی:</label>
      <textarea id="fa-prompt-input" placeholder="توصیف تصویر مورد نظر (مثلاً: طبیعت سرسبز کوهستانی در غروب)..."></textarea>
      <button class="btn-action" style="background: #3b82f6;" onclick="translateFaToEnPrompt()">ترجمه توصیف به انگلیسی</button>
    </div>

    <div class="form-group">
      <label>۲. پرامپت انگلیسی آماده شده برای ارسال:</label>
      <textarea id="ai-prompt-input" placeholder="پرامپت انگلیسی در اینجا قرار خواهد گرفت..."></textarea>
    </div>

    <button class="btn-action" style="background: #10b981;" onclick="submitAIGeneration()">تولید و ساخت تصویر</button>

    <div class="result-box" id="ai-image-result" style="text-align: center;">
      تصویر ساخته‌شده اینجا نمایش داده می‌شود...
    </div>
  </div>

  <!-- بخش سوم: گالری ذخیره -->
  <div class="card">
    <h2>🖼️ گالری تصاویر</h2>
    <div class="media-gallery" id="media-gallery"></div>
  </div>

</div>

<script>
  var SYSTEM_PROMPT_PREFIX = "Photorealistic, highly detailed, 8k resolution, ";
  var mediaItems = [];

  // ۱. تابع ترجمه عمومی
  async function sendTranslationRequest() {
    const textInput = document.getElementById('trans-text-input');
    const sourceInput = document.getElementById('trans-source-lang');
    const targetInput = document.getElementById('trans-target-lang');
    const resBox = document.getElementById('translation-result');

    const text = textInput.value.trim();
    const source = sourceInput ? sourceInput.value : 'fa';
    const target = targetInput ? targetInput.value : 'en';

    if (!text) {
      alert("لطفاً متنی برای ترجمه وارد کنید.");
      return;
    }

    resBox.innerText = "در حال ترجمه... لطفاً منتظر بمانید.";

    try {
      const langPair = (source === 'auto' ? 'autodetect' : source) + '|' + target;
      const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(langPair)}`;
      
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data && data.responseData && data.responseData.translatedText) {
        resBox.innerText = data.responseData.translatedText;
      } else {
        resBox.innerText = "ترجمه‌ای یافت نشد.";
      }
    } catch (e) {
      resBox.innerText = "خطا در دریافت ترجمه. لطفاً اتصال اینترنت خود را بررسی کنید.";
    }
  }

  // ۲. تابع ترجمه پرامپت فارسی به انگلیسی (بدون تداخل با متن قبلی)
  async function translateFaToEnPrompt() {
    const faInput = document.getElementById('fa-prompt-input');
    const enInput = document.getElementById('ai-prompt-input');

    const faText = faInput.value.trim();
    if (!faText) {
      alert("لطفاً ابتدا متن توصیف فارسی را وارد کنید.");
      return;
    }

    enInput.value = "در حال ترجمه متن به انگلیسی...";

    try {
      const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(faText)}&langpair=fa|en`;
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data && data.responseData && data.responseData.translatedText) {
        enInput.value = SYSTEM_PROMPT_PREFIX + data.responseData.translatedText.trim();
      } else {
        enInput.value = SYSTEM_PROMPT_PREFIX + faText;
      }
    } catch (e) {
      enInput.value = SYSTEM_PROMPT_PREFIX + faText;
    }
  }

  // ۳. تابع ساخت تصویر با هوش مصنوعی
  async function submitAIGeneration() {
    const enInput = document.getElementById('ai-prompt-input');
    const resBox = document.getElementById('ai-image-result');

    const fullPrompt = enInput.value.trim();

    if (!fullPrompt) {
      alert("لطفاً توصیف تصویر را به انگلیسی بنویسید یا ابتدا متن فارسی را ترجمه کنید.");
      return;
    }

    resBox.innerHTML = '<p style="color:#8b5cf6; font-weight:bold;">در حال ساخت تصویر... لطفاً چند لحظه شکیبا باشید.</p>';

    const seed = Math.floor(Math.random() * 1000000);
    const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?seed=${seed}&width=1280&height=720&nologo=true`;

    const img = new Image();
    img.style.maxWidth = '100%';
    img.style.borderRadius = '8px';

    img.onload = () => {
      resBox.innerHTML = '';
      resBox.appendChild(img);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn-action';
      saveBtn.style.marginTop = '15px';
      saveBtn.innerText = '➕ افزودن به گالری';
      saveBtn.onclick = () => {
        mediaItems.unshift({
          src: imageUrl,
          title: fullPrompt.replace(SYSTEM_PROMPT_PREFIX, '')
        });
        renderGallery();
        alert("تصویر به گالری اضافه شد.");
      };
      resBox.appendChild(saveBtn);
    };

    img.onerror = () => {
      resBox.innerHTML = '<p style="color:#ef4444; font-weight:bold;">خطا در دریافت تصویر. لطفاً مجدداً دکمه ساخت تصویر را بزنید.</p>';
    };

    img.src = imageUrl;
  }

  function renderGallery() {
    const gallery = document.getElementById('media-gallery');
    gallery.innerHTML = '';
    mediaItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'media-card';
      card.innerHTML = `<img src="${item.src}"><p style="font-size:0.8rem; margin-top:5px;">${item.title.substring(0, 30)}...</p>`;
      gallery.appendChild(card);
    });
  }
</script>

</body>
</html>
