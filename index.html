<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برنامه NatureScenic2 - آپلود و مترجم</title>

  <!-- کتابخانه رسمی Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .download-container {
      text-align: center;
      margin: 20px 0 30px 0;
    }

    .btn-download {
      background-color: #22c55e;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }

    .btn-download:hover {
      background-color: #16a34a;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    textarea, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }

    .btn-action {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-rename { background: #0284c7; color: white; }
    .btn-delete { background: #ef4444; color: white; }

    .translation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .speaker-btn {
      background: #38bdf8;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: background 0.2s;
    }

    .speaker-btn:hover { background: #0284c7; }

    .translation-result {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      min-height: 50px;
      border: 1px solid #334155;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <h2>برنامه مدیریت فایل و مترجم</h2>
  
  <!-- دکمه دانلود مستقیم فایل APK -->
  <div class="download-container">
    <a href="https://xvkbwsejloapnkjgrjde.supabase.co/storage/v1/object/public/NatureScenic2-ai/app-release.apk" download class="btn-download">
      📥 دانلود مستقیم اپلیکیشن اندروید (APK)
    </a>
  </div>

  <!-- بخش آپلود فایل -->
  <div style="margin-bottom: 20px;">
    <label for="file-input" class="btn-action btn-rename" style="display:inline-block; cursor:pointer;">انتخاب و آپلود مستقیم عکس به Supabase</label>
    <input type="file" id="file-input" style="display:none;" onchange="handleFileUpload(event, 'image')">
  </div>

  <!-- دکمه باز کردن مترجم -->
  <button class="btn-action btn-rename" onclick="openChatModal()">باز کردن مترجم صوتی</button>

  <!-- مودال مترجم -->
  <div class="modal-overlay" id="chat-modal">
    <div class="modal-content">
      <h3 id="modal-trans-title" style="margin:0;">🌐 مترجم پیشرفته زبان‌ها</h3>
      <textarea id="trans-text-input" rows="3" placeholder="متن خود را اینجا بنویسید..."></textarea>
      
      <select id="trans-target-lang">
        <option value="fa">فارسی (Persian)</option>
        <option value="en" selected>انگلیسی (English)</option>
        <option value="ar">عربی (Arabic)</option>
        <option value="fr">فرانسوی (French)</option>
        <option value="de">آلمانی (German)</option>
        <option value="es">اسپانیایی (Spanish)</option>
        <option value="tr">ترکی (Turkish)</option>
        <option value="ru">روسی (Russian)</option>
      </select>
      
      <button class="btn-action btn-rename" onclick="sendTranslationRequest()">ترجمه کن / Translate</button>
      
      <div class="translation-header">
        <span style="color:#94a3b8; font-size:0.9rem;">نتیجه ترجمه:</span>
        <button class="speaker-btn" onclick="playTextToSpeech()" title="پخش صوتی">🔊</button>
      </div>
      
      <div class="translation-result" id="translation-result">نتیجه ترجمه...</div>
      
      <button class="btn-action btn-delete" style="width:auto; align-self:flex-end;" onclick="closeChatModal()">بستن / Close</button>
    </div>
  </div>

  <!-- کدهای جاوااسکریپت -->
  <script>
    const SUPABASE_URL = "https://xvkbwsejloapnkjgrjde.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PjBM2rAkc1U3WyrXhVfPCQ_5qrIs_da"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let mediaItems = [];

    // آپلود فایل عکس به باکت dilgon-image
    async function uploadFileToSupabase(file) {
      const fileName = `${Date.now()}_${file.name}`;
      const bucketName = 'dilgon-image'; 

      const { data, error } = await supabaseClient.storage
        .from(bucketName)
        .upload(fileName, file, { cacheControl: '3600', upsert: false });

      if (error) throw new Error(error.message);

      const { data: publicUrlData } = supabaseClient.storage
        .from(bucketName)
        .getPublicUrl(fileName);

      return publicUrlData.publicUrl;
    }

    async function handleFileUpload(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      alert("در حال آپلود مستقیم فایل به Supabase...");
      
      try {
        const directUrl = await uploadFileToSupabase(file);
        const newItem = {
          id: String(Date.now()),
          type: type,
          src: directUrl,
          titleFa: file.name
        };
        mediaItems.unshift(newItem);
        alert("فایل با موفقیت آپلود شد.\nلینک فایل: " + directUrl);
      } catch (error) {
        alert("خطا در آپلود: " + error.message);
      }
    }

    function openChatModal() { document.getElementById('chat-modal').style.display = 'flex'; }
    function closeChatModal() { document.getElementById('chat-modal').style.display = 'none'; }

    async function sendTranslationRequest() {
      const text = document.getElementById('trans-text-input').value;
      const targetLang = document.getElementById('trans-target-lang').value;
      const resultDiv = document.getElementById('translation-result');

      if (!text.trim()) return alert("لطفاً متنی برای ترجمه وارد کنید.");

      resultDiv.innerText = "در حال ترجمه...";

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        const translatedText = data[0].map(item => item[0]).join('');
        resultDiv.innerText = translatedText;
      } catch (err) {
        resultDiv.innerText = "خطا در برقراری ارتباط با سرور ترجمه.";
      }
    }

    function playTextToSpeech() {
      const text = document.getElementById('translation-result').innerText;
      const targetLang = document.getElementById('trans-target-lang').value;

      if (!text || text === "نتیجه ترجمه...") return alert("متنی برای خواندن وجود ندارد.");

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = targetLang;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("مرورگر شما از قابلیت تلفظ صوتی پشتیبانی نمی‌کند.");
      }
    }
  </script>
</body>
</html>
