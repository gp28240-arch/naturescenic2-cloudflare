<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naturescenic2-ai | دستیار اختصاصی طبیعت</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
      direction: rtl;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .yt-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #cc0000;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(204, 0, 0, 0.4);
      transition: 0.3s;
    }
    .yt-btn:hover { background-color: #ff0000; }
    .yt-logo { height: 28px; width: auto; border-radius: 4px; }
    .header-titles h2 { color: #38bdf8; font-size: 1.4rem; }
    .header-titles p { font-size: 0.9rem; color: #94a3b8; }

    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 15px;
    }
    .btn {
      font-weight: bold;
      background-color: #1e293b;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn:hover { background-color: #38bdf8; color: #0f172a; }
    .btn-ai { background-color: #a855f7; color: #ffffff; border-color: #a855f7; }
    .btn-ai:hover { background-color: #9333ea; }

    .ai-inline-box {
      background: #1e293b;
      border: 2px solid #a855f7;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .ai-inline-input {
      flex: 1;
      min-width: 250px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
    }
    .ai-status-text {
      width: 100%;
      color: #c084fc;
      font-size: 0.85rem;
      display: none;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .media-card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }
    .media-card img, .media-card video { width: 100%; height: 180px; object-fit: cover; }
    .media-card audio { width: 90%; margin: 20px auto; }
    .card-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
    .card-title-fa { font-weight: bold; color: #f8fafc; }
    .btn-delete { background-color: #dc2626; color: white; border: none; padding: 6px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <header class="main-header">
    <a href="https://youtube.com/@naturescenic2" target="_blank" class="yt-btn">
      <img src="https://drive.google.com/thumbnail?id=1EZf35v8476qtDC_rTS_h-6-_zIq0RNTh&sz=w200" alt="Logo" class="yt-logo">
      <span>YouTube: @naturescenic2</span>
    </a>
    <div class="header-titles">
      <h2>naturescenic2-ai</h2>
      <p>طبیعت دیلگون، کهگیلویه و بویراحمد</p>
    </div>
  </header>

  <div class="control-panel">
    <label class="btn">
      📷 آپلود عکس
      <input type="file" id="upload-image" accept="image/*" hidden onchange="handleFileUpload(event, 'image')">
    </label>
    <label class="btn">
      🎥 آپلود ویدیو
      <input type="file" id="upload-video" accept="video/*" hidden onchange="handleFileUpload(event, 'video')">
    </label>
    <label class="btn">
      🎵 آپلود صدا
      <input type="file" id="upload-audio" accept="audio/*" hidden onchange="handleFileUpload(event, 'audio')">
    </label>
  </div>

  <div class="ai-inline-box">
    <span style="font-weight:bold; color:#c084fc;">✨ ساخت تصویر هوش مصنوعی:</span>
    <input type="text" id="ai-prompt-input" class="ai-inline-input" placeholder="توصیف تصویر...">
    <button class="btn btn-ai" id="btn-submit-ai" onclick="submitAIGeneration()">ساخت عکس</button>
    <div class="ai-status-text" id="ai-loading-status">⏳ در حال دریافت تصویر از سرور کلودفلر...</div>
  </div>

  <div class="media-grid" id="media-grid"></div>

  <script>
    const WORKER_URL = 'https://naturescenic2-cloudflare.gp28240.workers.dev';

    window.addEventListener('DOMContentLoaded', loadSavedFiles);

    async function loadSavedFiles() {
      try {
        const res = await fetch(`${WORKER_URL}/list-files`);
        if (res.ok) {
          const files = await res.json();
          files.forEach(file => {
            const ext = file.name.split('.').pop().toLowerCase();
            let type = 'image';
            if (['mp4', 'webm', 'ogg'].includes(ext)) type = 'video';
            if (['mp3', 'wav', 'ogg'].includes(ext)) type = 'audio';
            createMediaCard(file.url, type, file.name);
          });
        }
      } catch (e) {
        console.error("خطا در دریافت لیست فایل‌ها از سرور:", e);
      }
    }

    async function handleFileUpload(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("type", type);

      try {
        const response = await fetch(`${WORKER_URL}/upload`, {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const resData = await response.json();
          createMediaCard(resData.url || URL.createObjectURL(file), type, file.name);
        } else {
          alert("خطا در آپلود روی سرور کلودفلر.");
        }
      } catch (e) {
        alert("خطا در برقراری ارتباط با سرور کلودفلر.");
      }
    }

    async function submitAIGeneration() {
      const promptInput = document.getElementById('ai-prompt-input');
      const promptText = promptInput.value.trim();
      const loadingStatus = document.getElementById('ai-loading-status');
      const btnSubmit = document.getElementById('btn-submit-ai');

      if (!promptText) {
        alert("لطفاً توصیف تصویر را بنویسید.");
        return;
      }

      loadingStatus.style.display = 'block';
      btnSubmit.disabled = true;

      try {
        const response = await fetch(`${WORKER_URL}/generate-image`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });

        if (response.ok) {
          const blob = await response.blob();
          const imageUrl = URL.createObjectURL(blob);
          createMediaCard(imageUrl, 'image', `هوش مصنوعی: ${promptText}`);
          promptInput.value = '';
        } else {
          alert("خطا در تولید تصویر از سمت سرور.");
        }
      } catch (e) {
        alert("خطای ارتباط با سرور کلودفلر هنگام ساخت تصویر.");
      } finally {
        loadingStatus.style.display = 'none';
        btnSubmit.disabled = false;
      }
    }

    function createMediaCard(fileUrl, type, name) {
      const grid = document.getElementById('media-grid');
      const newId = Date.now();
      const card = document.createElement('div');
      card.className = 'media-card';
      card.id = `card-${newId}`;

      let mediaTag = `<img src="${fileUrl}" alt="${name}">`;
      if (type === 'video') mediaTag = `<video src="${fileUrl}" controls></video>`;
      if (type === 'audio') mediaTag = `<audio src="${fileUrl}" controls></audio>`;

      card.innerHTML = `
        ${mediaTag}
        <div class="card-body">
          <div class="card-title-fa">${name}</div>
          <button class="btn-delete" onclick="document.getElementById('card-${newId}').remove()">🗑️ حذف</button>
        </div>
      `;
      grid.prepend(card);
    }
  </script>
</body>
</html>
