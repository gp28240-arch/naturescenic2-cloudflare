<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند طبیعت</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #333333;
        }

        body {
            font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 24px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #e0e0e0;
            color: #333;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* بخش چت */
        .chat-box {
            height: 380px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.6;
        }

        .user-message {
            background: #e3f2fd;
            color: #0d47a1;
            margin-right: auto;
            text-align: right;
        }

        .bot-message {
            background: #e8f5e9;
            color: #1b5e20;
            margin-left: auto;
            text-align: right;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        button.send-btn {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button.send-btn:hover {
            background: var(--primary-dark);
        }

        /* بخش عکس */
        .image-result {
            margin-top: 20px;
            text-align: center;
        }

        .image-result img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: none;
        }

        .loading {
            display: none;
            color: #666;
            font-style: italic;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>دستیار هوشمند naturescenic2</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('chat')">💬 گفتگوی متنی</button>
        <button class="tab-btn" onclick="switchTab('image')">🎨 ساخت تصویر</button>
    </div>

    <!-- تب گفتگو -->
    <div id="chat-tab" class="tab-content active">
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">سلام! من دستیار هوشمند شما هستم. چطور می‌توانم کمکتان کنم؟</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="پیام خود را بنویسید..." onkeypress="handleKeyPress(event, 'chat')">
            <button class="send-btn" onclick="sendMessage()">ارسال</button>
        </div>
    </div>

    <!-- تب ساخت تصویر -->
    <div id="image-tab" class="tab-content">
        <div class="input-group">
            <input type="text" id="imagePrompt" placeholder="توصیف تصویر (مثلاً: یک کبگ روی صخره‌های کوهستانی...)" onkeypress="handleKeyPress(event, 'image')">
            <button class="send-btn" onclick="generateImage()">ساخت تصویر</button>
        </div>
        <div class="loading" id="imageLoading">در حال طراحی تصویر، لطفاً چند ثانیه شکیبا باشید...</div>
        <div class="image-result">
            <img id="generatedImg" src="" alt="تصویر تولید شده">
        </div>
    </div>
</div>

<script>
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'chat') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('chat-tab').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('image-tab').classList.add('active');
        }
    }

    function handleKeyPress(e, type) {
        if (e.key === 'Enter') {
            if (type === 'chat') sendMessage();
            if (type === 'image') generateImage();
        }
    }

    // ارسال پیام متنی
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        const chatBox = document.getElementById('chatBox');
        
        // نمایش پیام کاربر
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.textContent = text;
        chatBox.appendChild(userDiv);
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // پیام در حال پاسخ
        const botDiv = document.createElement('div');
        botDiv.className = 'message bot-message';
        botDiv.textContent = 'در حال پاسخگویی...';
        chatBox.appendChild(botDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // فراخوانی فانکشن مستقیم کلادفلر
            const response = await fetch('/functions/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });

            if (response.ok) {
                const data = await response.json();
                botDiv.textContent = data.reply || "پاسخی دریافت نشد.";
            } else {
                // اگر مستقیم پاسخ نداد، فراخوانی مستقیم هوش مصنوعی
                const altRes = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
                if (altRes.ok) {
                    botDiv.textContent = await altRes.text();
                } else {
                    botDiv.textContent = 'در حال حاضر ارتباط برقرار نشد. لطفاً مجدداً پیام بفرستید.';
                }
            }
        } catch (err) {
            botDiv.textContent = 'خطا در برقراری ارتباط با سرور.';
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // تولید تصویر با ترجمه خودکار به انگلیسی برای دقت بالا
    async function generateImage() {
        const promptInput = document.getElementById('imagePrompt');
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        const imgElement = document.getElementById('generatedImg');
        const loading = document.getElementById('imageLoading');

        imgElement.style.display = 'none';
        loading.style.display = 'block';

        // دیکشنری ساده برای واژه‌های کلیدی جهت دقت در تصویرسازی
        let translatedPrompt = prompt
            .replace(/کبگ/g, 'chukar partridge')
            .replace(/خرگوش/g, 'rabbit')
            .replace(/کوه/g, 'mountain')
            .replace(/طبیعت/g, 'nature')
            .replace(/پرنده/g, 'bird')
            .replace(/نقاشی کن/g, '')
            .replace(/بکش/g, '');

        const seed = Math.floor(Math.random() * 999999);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(translatedPrompt)}?seed=${seed}&width=1024&height=1024&nologo=true`;

        imgElement.onload = function() {
            loading.style.display = 'none';
            imgElement.style.display = 'inline-block';
        };

        imgElement.onerror = function() {
            loading.style.display = 'none';
            alert('خطا در دریافت تصویر. لطفاً دوباره تلاش کنید.');
        };

        imgElement.src = imageUrl;
    }
</script>

</body>
</html>
