<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naturescenic2-ai | دستیار اختصاصی طبیعت</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; direction: rtl; }

    /* سربرگ */
    .main-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    .yt-btn { display: flex; align-items: center; gap: 10px; background-color: #cc0000; color: #ffffff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    .yt-logo { height: 32px; width: auto; border-radius: 4px; }
    .header-titles h2 { color: #38bdf8; font-size: 1.4rem; }
    .header-titles p { font-size: 0.9rem; color: #94a3b8; }

    /* دکمه‌ها */
    .control-panel { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; }
    .btn { font-weight: bold; background-color: #1e293b; color: #ffffff; padding: 12px 20px; border-radius: 8px; border: 2px solid #38bdf8; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
    .btn:hover { background-color: #38bdf8; color: #0f172a; }
    .btn-ai { border-color: #a855f7; color: #c084fc; }
    .btn-download { border-color: #22c55e; color: #4ade80; }

    /* شبکه‌بندی رسانه‌ها */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .media-card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; display: flex; flex-direction: column; }
    .media-card img, .media-card video { width: 100%; height: 180px; object-fit: cover; }
    .media-card audio { width: 90%; margin: 20px auto; }
    .card-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }

    /* بخش ساخت عکس هوش مصنوعی (طراحی بزرگ و کامل) */
    .ai-section { display: none; background: #1e293b; border: 2px solid #a855f7; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .ai-section.active { display: block; }
    .ai-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin: 10px 0; }
    .ai-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-submit { background: #a855f7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-cancel { background: #475569; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <header class="main-header">
    <a href="https://youtube.com/@naturescenic2" target="_blank" class="yt-btn">
      <img src="https://lh3.googleusercontent.com/d/1EZf35v8476qtDC_rTS_h-6-_zIq0RNTh" alt="Logo" class="yt-logo">
      <span>کانال یوتیوب / YouTube: @naturescenic2</span>
    </a>
    <div class="header-titles">
      <h2>naturescenic2-ai</h2>
      <p>طبیعت دیلگون، کهگیلویه و بویراحمد (کوهستان زاگرس)</p>
    </div>
  </header>

  <div class="control-panel">
    <!-- لینک مستقیم فایل نصب برنامه (آدرس APK خود را دقیقاً جایگزین این لینک کنید) -->
    <a href="https://naturescenic2-cloudflare.gp28240.workers.dev/download-app.apk" class="btn btn-download" download>📥 دانلود اپلیکیشن (مستقیم)</a>

    <label class="btn">
      📷 آپلود عکس
      <input type="file" id="upload-image" accept="image/*" hidden onchange="uploadToServer(event, 'image')">
    </label>
    
    <label class="btn">
      🎥 آپلود ویدیو
      <input type="file" id="upload-video" accept="video/*" hidden onchange="uploadToServer(event, 'video')">
    </label>

    <label class="btn">
      🎵 آپلود صدا
      <input type="file" id="upload-audio" accept="audio/*" hidden onchange="uploadToServer(event, 'audio')">
    </label>

    <button class="btn btn-ai" onclick="toggleAISection()">✨ ساخت عکس هوش مصنوعی</button>
  </div>

  <!-- کادر ساخت عکس هوش مصنوعی (کامل و غیر شناور) -->
  <div class="ai-section" id="ai-section">
    <h3>✨ ساخت تصویر با هوش مصنوعی (Cloudflare)</h3>
    <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 5px;">توصیف کامل تصویر مورد نظرتان را وارد کنید:</p>
    <input type="text" class="ai-input" id="ai-prompt" placeholder="مثلاً: منظر طبیعی زاگرس، آفتابی، کیفیت بالا...">
    <div class="ai-actions">
      <button class="btn-cancel" onclick="toggleAISection()">بستن</button>
      <button class="btn-submit" onclick="generateAIImage()">تأیید و ساخت تصویر</button>
    </div>
  </div>

  <div class="media-grid" id="media-grid">
    <!-- فایل‌ها پس از آپلود در سرور در این قسمت بارگیری می‌شوند -->
  </div>

  <script>
    const WORKER_URL = 'https://naturescenic2-cloudflare.gp28240.workers.dev';

    function toggleAISection() {
      const section = document.getElementById('ai-section');
      section.classList.toggle('active');
    }

    // ارسال فایل به ورکر Cloudflare جهت ذخیره دائمی
    async function uploadToServer(event, type) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);
      formData.append('type', type);

      // ارسال فایل به سرور واقعی
      try {
        const response = await fetch(`${WORKER_URL}/upload`, {
          method: 'POST',
          body: formData
        });
        if (response.ok) {
          loadGlobalMedia(); // دریافت مجدد لیست فایل‌ها از سرور
        }
      } catch (e) {
        console.log("جهت ذخیره دائمی نیازمند تنظیم Cloudflare R2 در Worker هستید.");
      }
    }

    // دریافت فایل‌های ذخیره شده در سرور (نمایش به تمام کاربران دنیا)
    async function loadGlobalMedia() {
      try {
        const res = await fetch(`${WORKER_URL}/list-media`);
        const data = await res.json();
        // رندر کردن فایل‌های جهانی...
      } catch (e) {}
    }

    async function generateAIImage() {
      const prompt = document.getElementById('ai-prompt').value;
      if (!prompt) return;

      await fetch(`${WORKER_URL}/generate-image`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      });
      toggleAISection();
    }

    // بارگیری اولیه فایل‌های سرور هنگام باز شدن سایت
    window.onload = loadGlobalMedia;
  </script>
</body>
</html>
