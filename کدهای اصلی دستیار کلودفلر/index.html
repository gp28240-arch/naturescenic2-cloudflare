<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار هوشمند Naturescenic</title>
  <style>
    :root {
      --bg-color: #111827;
      --chat-bg: #1f2937;
      --user-msg: #3b82f6;
      --bot-msg: #374151;
      --text-color: #f3f4f6;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { background: var(--chat-bg); padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #374151; display: flex; justify-content: space-between; align-items: center; }
    .archive-btn { background: var(--accent); color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.6; font-size: 0.9rem; word-break: break-word; position: relative; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .user { background: var(--user-msg); align-self: flex-end; border-bottom-left-radius: 2px; }
    .bot { background: var(--bot-msg); align-self: flex-start; border-bottom-right-radius: 2px; }

    .media-content { width: 100%; max-width: 350px; border-radius: 8px; margin-top: 8px; display: block; overflow: hidden; border: 1px solid #4b5563; }
    video.media-content { background: #000; height: 200px; }
    audio.media-content { height: 40px; background: #2a3241; }

    .carousel { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--accent) #1f2937; }
    .carousel-item { flex: 0 0 200px; height: 130px; border-radius: 8px; overflow: hidden; border: 1px solid #4b5563; position: relative; scroll-snap-align: start; cursor: pointer; transition: transform 0.2s; }
    .carousel-item:hover { transform: scale(1.03); }
    .carousel-item img { width: 100%; height: 100%; object-fit: cover; }
    .carousel-item .file-name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); padding: 4px; font-size: 0.7rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }

    #input-bar { background: var(--chat-bg); padding: 12px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #374151; }
    #text-input { flex: 1; background: var(--bg-color); border: 1px solid #4b5563; color: #fff; padding: 11px 15px; border-radius: 20px; outline: none; font-size: 0.9rem; }
    #text-input:focus { border-color: var(--accent); }

    .btn { background: var(--accent); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 1rem; }
    .btn:hover { background: #3b82f6; }
    .btn-attach { background: #4b5563; }
    .btn-attach:hover { background: #6b7280; }
    #file-upload { display: none; }
  </style>
</head>
<body>

  <header>
    <span>Naturescenic AI</span>
    <button class="archive-btn" onclick="showGallery()">📂 آرشیو</button>
  </header>

  <div id="chat-container">
    <div class="msg bot">سلام! من دستیار شما هستم. می‌توانید فایل‌های عکس، ویدیو، صدا بفرستید یا متن بنویسید.</div>
  </div>

  <div id="input-bar">
    <label for="file-upload" class="btn btn-attach" title="ارسال فایل">📎</label>
    <input type="file" id="file-upload" accept="image/*,video/*,audio/*" onchange="uploadFile()">
    <input type="text" id="text-input" placeholder="پیامی بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="btn" onclick="sendMessage()">➔</button>
  </div>

  <script>
    // آدرس دقیق ورکر جاگذاری شده شما
    const API_URL = "https://naturescenic2-cloudflare.gp28240.workers.dev";

    function appendMessage(sender, contentHTML) {
      const container = document.getElementById("chat-container");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerHTML = contentHTML;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    async function uploadFile() {
      const fileInput = document.getElementById("file-upload");
      const file = fileInput.files[0];
      if (!file) return;

      appendMessage("user", `در حال ارسال: <b>${file.name}</b>...`);

      const formData = new FormData();
      formData.append("file", file);
      formData.append("type", file.type);

      try {
        const res = await fetch(`${API_URL}/upload`, { method: "POST", body: formData });
        const data = await res.json();

        if (data.success || data.url) {
          let mediaHTML = "";
          if (file.type.startsWith("image/")) {
            mediaHTML = `<img src="${data.url}" style="max-width:100%; border-radius:8px; margin-top:8px;">`;
          } else if (file.type.startsWith("video/")) {
            mediaHTML = `<video class="media-content" controls><source src="${data.url}" type="${file.type}"></video>`;
          } else if (file.type.startsWith("audio/")) {
            mediaHTML = `<audio class="media-content" controls><source src="${data.url}" type="${file.type}"></audio>`;
          }
          appendMessage("bot", `فایل با موفقیت دریافت شد:<br>${mediaHTML}`);
        } else {
          appendMessage("bot", "⚠️ خطا در پردازش فایل روی سرور.");
        }
      } catch (err) {
        appendMessage("bot", "⚠️ خطا در ارتباط با سرور.");
      }
      fileInput.value = "";
    }

    async function sendMessage() {
      const input = document.getElementById("text-input");
      const text = input.value.trim();
      if (!text) return;

      appendMessage("user", text);
      input.value = "";

      if (text.startsWith("عکس ") || text.startsWith("تصویر ")) {
        appendMessage("bot", "🎨 در حال تولید تصویر با هوش مصنوعی...");
        const prompt = text.replace(/^(عکس|تصویر)\s+/, "");
        
        try {
          const res = await fetch(`${API_URL}/generate-image`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });
          const blob = await res.blob();
          const imgUrl = URL.createObjectURL(blob);
          appendMessage("bot", `<img src="${imgUrl}" style="max-width:100%; border-radius:8px;">`);
        } catch (e) {
          appendMessage("bot", "⚠️ خطا در تولید تصویر.");
        }
      } else {
        appendMessage("bot", "پیام دریافت شد.");
      }
    }

    async function showGallery() {
      appendMessage("bot", "در حال دریافت آرشیو فایل‌ها...");
      try {
        const res = await fetch(`${API_URL}/list-files`);
        const files = await res.json();
        
        if (!files || files.length === 0) {
          appendMessage("bot", "هیچ فایلی در آرشیو یافت نشد.");
          return;
        }

        let carouselHTML = `<div><b>آرشیو فایل‌ها:</b><div class="carousel">`;
        files.forEach(f => {
          carouselHTML += `<div class="carousel-item" onclick="window.open('${f.url}', '_blank')"><img src="${f.url}"><div class="file-name">${f.name}</div></div>`;
        });
        carouselHTML += `</div></div>`;
        appendMessage("bot", carouselHTML);
      } catch (e) {
        appendMessage("bot", "خطا در دریافت آرشیو.");
      }
    }
  </script>
</body>
</html>
