<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار هوشمند naturescenic2</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body { background: #121212; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-break: break-word; }
    .user { background: #0084ff; align-self: flex-end; color: #fff; }
    .bot { background: #262626; align-self: flex-start; color: #ddd; }
    
    /* گالری چرخشی عکس‌ها */
    .carousel { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; scroll-snap-type: x mandatory; }
    .carousel img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; scroll-snap-align: start; flex-shrink: 0; border: 1px solid #444; }
    
    /* رسانه‌ها */
    video, audio { max-width: 100%; border-radius: 8px; margin-top: 5px; }

    /* کادر ارسال */
    #input-area { display: flex; padding: 10px; background: #1e1e1e; border-top: 1px solid #333; gap: 8px; align-items: center; }
    #message-input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; }
    .btn { background: #0084ff; border: none; color: white; padding: 10px 14px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .file-btn { background: #333; }
    #file-input { display: none; }
  </style>
</head>
<body>

  <div id="chat-container">
    <div class="message bot">سلام! دستیار شما آماده است. می‌توانید فایل ارسال کنید یا گفتگو را شروع کنید.</div>
  </div>

  <div id="input-area">
    <label for="file-input" class="btn file-btn">📎</label>
    <input type="file" id="file-input" accept="image/*,video/*,audio/*" onchange="uploadFile()">
    <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="btn" onclick="sendMessage()">➔</button>
  </div>

  <script>
    const WORKER_URL = "https://naturescenic2-cloudflare.pages.dev"; // آدرس دامنه ورکر/پیج شما

    function appendMessage(sender, content) {
      const chat = document.getElementById("chat-container");
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;
      msg.innerHTML = content;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    async function uploadFile() {
      const fileInput = document.getElementById("file-input");
      const file = fileInput.files[0];
      if (!file) return;

      appendMessage("user", `در حال آپلود فایل: ${file.name}...`);
      const formData = new FormData();
      formData.append("file", file);
      formData.append("type", file.type.split('/')[0]);

      try {
        const res = await fetch(`${WORKER_URL}/upload`, { method: "POST", body: formData });
        const data = await res.json();

        if (data.success) {
          let html = "";
          if (file.type.startsWith("image/")) {
            html = `<img src="${data.url}" style="max-width:100%; border-radius:8px;">`;
          } else if (file.type.startsWith("video/")) {
            html = `<video controls><source src="${data.url}" type="${file.type}"></video>`;
          } else if (file.type.startsWith("audio/")) {
            html = `<audio controls><source src="${data.url}" type="${file.type}"></audio>`;
          } else {
            html = `<a href="${data.url}" target="_blank" style="color:#66b3ff;">دانلود فایل: ${data.name}</a>`;
          }
          appendMessage("bot", `فایل با موفقیت آپلود شد:<br>${html}`);
        } else {
          appendMessage("bot", "خطا در آپلود فایل.");
        }
      } catch (e) {
        appendMessage("bot", "خطا در برقراری ارتباط با سرور.");
      }
      fileInput.value = "";
    }

    async function sendMessage() {
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (!text) return;

      appendMessage("user", text);
      input.value = "";

      // اگر دستور ساخت تصویر باشد
      if (text.startsWith("تصویر ") || text.startsWith("عکس ")) {
        appendMessage("bot", "در حال ساخت تصویر با هوش مصنوعی...");
        const prompt = text.replace(/^(تصویر|عکس)\s+/, "");
        try {
          const res = await fetch(`${WORKER_URL}/generate-image`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });
          const blob = await res.blob();
          const imgUrl = URL.createObjectURL(blob);
          appendMessage("bot", `<img src="${imgUrl}" style="max-width:100%; border-radius:8px;">`);
        } catch (e) {
          appendMessage("bot", "خطا در ساخت تصویر.");
        }
      } else {
        appendMessage("bot", "پیام شما دریافت شد.");
      }
    }
  </script>
</body>
</html>
