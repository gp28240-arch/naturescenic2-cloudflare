<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature & Scenic | طبیعت و گردشگری</title>
    <style>
        :root { --primary: #2e7d32; --bg: #f4f7f6; }
        body { font-family: Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 0; direction: rtl; color: #333; }
        
        header { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; padding: 25px 20px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .yt-btn { display: inline-block; background-color: #ff0000; color: white; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; margin-top: 10px; font-weight: bold; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: right; }
        
        audio, video { width: 100%; border-radius: 6px; margin-top: 10px; }
        img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin-top: 10px; }
        .desc { background: #eef7ee; padding: 10px; border-radius: 5px; font-size: 13px; margin-top: 10px; color: #2e4d2e; line-height: 1.6; }
        
        #google_translate_element { text-align: left; padding: 8px; background: #fff; }
    </style>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'fa', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>

    <div id="google_translate_element"></div>

    <header>
        <div class="logo">🌿 Nature & Scenic | کانال طبیعت</div>
        <a href="https://www.youtube.com/@naturescenic2" target="_blank" class="yt-btn">▶ عضویت در کانال یوتیوب</a>
    </header>

    <div class="container">

        <h2>🎵 فایل‌های صوتی</h2>
        <div class="card">
            <h3>صدای پرندگان و بلبل‌های کوهستانی</h3>
            <audio controls preload="metadata">
                <source src="https://github.com/gp28240-arch/naturescenic2-cloudflare/releases/download/v1/default.m4a" type="audio/mp4">
            </audio>
            <div class="desc"><strong>توضیحات:</strong> ضبط‌شده در طبیعت دل‌انگیز دشت چرام و دیلگون.</div>
        </div>

        <h2>🎥 ویدیوها</h2>
        <div class="card">
            <h3>ویدیوی طبیعت</h3>
            <video controls>
                <source src="https://github.com/gp28240-arch/naturescenic2-cloudflare/releases/download/v1/video1.mp4" type="video/mp4">
            </video>
            <div class="desc"><strong>توضیحات:</strong> مناظر فوق‌العاده طبیعت بکر.</div>
        </div>

        <h2>🖼️ تصاویر</h2>
        <div class="card">
            <h3>تصویر طبیعت</h3>
            <img src="https://github.com/gp28240-arch/naturescenic2-cloudflare/releases/download/v1/image1.jpg" alt="طبیعت">
            <div class="desc"><strong>توضیحات:</strong> نمای زیبای منطقه.</div>
        </div>

    </div>

</body>
</html>
