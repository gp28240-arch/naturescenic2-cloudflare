<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار هوشمند naturescenic2</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    
    /* هدر بالای دستیار */
    header { background: #1e293b; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #334155; }
    
    /* منطقه چت */
    #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 0.95rem; word-break: break-word; }
    .user { background: #2563eb; align-self: flex-end; border-bottom-left-radius: 4px; color: #fff; }
    .bot { background: #334155; align-self: flex-start; border-bottom-right-radius: 4px; color: #f1f5f9; }
    
    /* آلبوم چرخشی تصاویر (Carousel) */
    .carousel-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scroll-snap-type: x mandatory; }
    .carousel-container img { width: 180px; height: 120px; object-fit: cover; border-radius: 10px; scroll-snap-align: start; flex-shrink: 0; border: 2px solid #475569; }
    
    /* رسانه‌ها (ویدیو و صدا) */
    video, audio { width: 100%; max-width: 320px; border-radius: 10px; margin-top: 8px; display: block; }

    /* کادر پایین برای ارسال */
    #input-bar { background: #1e293b; padding: 12px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #334155; }
    #text-input { flex: 1; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 12px 16px; border-radius: 25px; outline: none; font-size: 0.95rem; }
    #text-input:focus { border-color: #3b82f6; }
    
    .icon-btn { background: #3b82f6; border: none; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:hover { background: #2563eb; }
    .attach-btn { background: #475569; }
    .attach-btn:hover { background: #64748b; }
    #file-upload { display: none; }
  </style>
</head>
<body>

  <header>دستیار هوشمند Naturescenic</header>

  <div id="chat-box">
    <div class="msg bot">سلام! من دستیار شما هستم. می‌تونید برام عکس، ویدیو یا صدای ضبط‌شده بفرستید یا متن بنویسید.</div>
  </div>

  <div id="input-bar">
    <label for="file-upload" class="icon-btn attach-btn" title="ارسال فایل">📎</label>
    <input type="file" id="file-upload" accept="image/*,video/*,audio/*" onchange="handleFileUpload()">
    <input type="text" id="text-input" placeholder="پیامی بنویسید..." onkeypress="if(event.key==='Enter') sendTextMessage()">
    <button class="icon-btn" onclick="sendTextMessage()">➔</button>
  </div>

  <script>
    // آدرس پروژه کلودفلر شما
    const API_BASE = "https://naturescenic2-cloudflare.pages.dev";

    function addMessage(sender, contentHTML) {
      const box = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerHTML = contentHTML;
      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    }

    // آپلود ویدیو، عکس و صدا
    async function handleFileUpload() {
      const fileInput = document.getElementById("file-upload");
      const file = fileInput.files[0];
      if (!file) return;

      addMessage("user", `در حال ارسال فایل: <b>${file.name}</b>...`);

      const formData = new FormData();
      formData.append("file", file);
      formData.append("type", file.type);

      try {
        const res = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
        const data = await res.json();

        if (data.success || data.url) {
          let mediaHTML = "";
          if (file.type.startsWith("image/")) {
            mediaHTML = `<img src="${data.url}" style="max-width:100%; border-radius:10px; margin-top:5px;">`;
          } else if (file.type.startsWith("video/")) {
            mediaHTML = `<video controls><source src="${data.url}" type="${file.type}"></video>`;
          } else if (file.type.startsWith("audio/")) {
            mediaHTML = `<audio controls><source src="${data.url}" type="${file.type}"></audio>`;
          } else {
            mediaHTML = `<a href="${data.url}" target="_blank" style="color:#60a5fa;">📥 دانلود فایل ${file.name}</a>`;
          }
          addMessage("bot", `فایل با موفقیت دریافت شد:<br>${mediaHTML}`);
        } else {
          addMessage("bot", "⚠️ خطا در ذخیره فایل روی سرور.");
        }
      } catch (err) {
        addMessage("bot", "⚠️ خطا در برقراری ارتباط با سرور.");
      }

      fileInput.value = "";
    }

    // ارسال متن و ساخت عکس با هوش مصنوعی
    async function sendTextMessage() {
      const input = document.getElementById("text-input");
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";

      // ساخت تصویر با هوش مصنوعی اگر کلمه "عکس" یا "تصویر" در پیام باشد
      if (text.startsWith("عکس ") || text.startsWith("تصویر ")) {
        addMessage("bot", "🎨 در حال ساخت تصویر...");
        const prompt = text.replace(/^(عکس|تصویر)\s+/, "");
        
        try {
          const res = await fetch(`${API_BASE}/generate-image`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });
          const blob = await res.blob();
          const imgUrl = URL.createObjectURL(blob);
          addMessage("bot", `<img src="${imgUrl}" style="max-width:100%; border-radius:10px;">`);
        } catch (e) {
          addMessage("bot", "⚠️ خطا در ساخت تصویر.");
        }
      } else {
        addMessage("bot", "پیام شما دریافت شد.");
      }
    }
  </script>
</body>
</html>
