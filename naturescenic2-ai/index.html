<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار هوشمند naturescenic2</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #334155;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--accent);
    }
    main {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    .chat-box {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1rem;
      min-height: 300px;
      border: 1px solid #334155;
      margin-bottom: 1rem;
    }
    .input-group {
      display: flex;
      gap: 0.5rem;
    }
    textarea {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      resize: none;
      height: 60px;
    }
    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 0 1.5rem;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>
    <h1>دستیار هوشمند naturescenic2</h1>
  </header>

  <main>
    <div class="chat-box" id="chatBox">
      <p style="color: var(--text-muted);">سلام! چطور می‌توانم کمکتان کنم؟</p>
    </div>

    <div class="input-group">
      <textarea id="userInput" placeholder="پیام خود را بنویسید..."></textarea>
      <button onclick="sendMessage()">ارسال</button>
    </div>
  </main>

  <script>
    function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      if (input.value.trim() !== '') {
        const p = document.createElement('p');
        p.textContent = 'شما: ' + input.value;
        chatBox.appendChild(p);
        input.value = '';
      }
    }
  </script>

</body>
</html>
